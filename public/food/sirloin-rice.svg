<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8F0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FEF3E2;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="plateGrad" cx="45%" cy="38%" r="58%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#F8F5F1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#EDE9E4;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="steakGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" style="stop-color:#92400E;stop-opacity:1"/>
      <stop offset="45%" style="stop-color:#78350F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#451A03;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="sauceGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#A16207;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#92400E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#78350F;stop-opacity:1"/>
    </radialGradient>
    <linearGradient id="depthOverlay" x1="0%" y1="55%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#78350F;stop-opacity:0.18"/>
    </linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" result="blend"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="blobBlur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="plateShadow">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#92400E" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="280" fill="url(#bgGrad)"/>

  <!-- Decorative background blobs -->
  <circle cx="55" cy="48" r="78" fill="#92400E" opacity="0.14" filter="url(#blobBlur)"/>
  <circle cx="425" cy="228" r="88" fill="#B45309" opacity="0.18" filter="url(#blobBlur)"/>
  <circle cx="400" cy="35" r="62" fill="#D97706" opacity="0.20" filter="url(#blobBlur)"/>
  <circle cx="70" cy="248" r="52" fill="#FDE68A" opacity="0.22" filter="url(#blobBlur)"/>

  <!-- Accent circles -->
  <circle cx="432" cy="55" r="18" fill="#92400E" opacity="0.12"/>
  <circle cx="452" cy="78" r="10" fill="#B45309" opacity="0.16"/>
  <circle cx="44" cy="218" r="14" fill="#78350F" opacity="0.14"/>
  <circle cx="22" cy="240" r="9" fill="#FDE68A" opacity="0.20"/>
  <circle cx="460" cy="190" r="11" fill="#FEF3C7" opacity="0.24"/>

  <!-- Ground shadow -->
  <ellipse cx="240" cy="253" rx="142" ry="17" fill="#78350F" opacity="0.12"/>

  <!-- Plate outer rim -->
  <ellipse cx="240" cy="178" rx="150" ry="100" fill="#EDE9E4" filter="url(#plateShadow)"/>
  <!-- Plate surface -->
  <ellipse cx="240" cy="175" rx="143" ry="95" fill="url(#plateGrad)"/>
  <!-- Plate inner rim line -->
  <ellipse cx="240" cy="175" rx="133" ry="86" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.65"/>

  <!-- Rice mound -->
  <ellipse cx="185" cy="200" rx="85" ry="48" fill="#FAFAF8"/>
  <ellipse cx="185" cy="195" rx="80" ry="44" fill="#FDFDFC"/>
  <!-- Rice texture -->
  <circle cx="148" cy="190" r="3.0" fill="#EFECEA"/>
  <circle cx="160" cy="183" r="2.8" fill="#F2EFEC"/>
  <circle cx="173" cy="188" r="3.3" fill="#EDE9E4"/>
  <circle cx="186" cy="181" r="2.9" fill="#F2EFEC"/>
  <circle cx="199" cy="185" r="3.1" fill="#EFECEA"/>
  <circle cx="212" cy="180" r="2.7" fill="#F2EFEC"/>
  <circle cx="224" cy="186" r="3.2" fill="#EDE9E4"/>
  <circle cx="236" cy="181" r="2.8" fill="#EFECEA"/>
  <circle cx="143" cy="200" r="2.6" fill="#EDE9E4"/>
  <circle cx="155" cy="205" r="3.0" fill="#EFECEA"/>
  <circle cx="168" cy="199" r="3.3" fill="#F2EFEC"/>
  <circle cx="181" cy="207" r="2.8" fill="#EDE9E4"/>
  <circle cx="194" cy="201" r="3.2" fill="#EFECEA"/>
  <circle cx="207" cy="207" r="2.6" fill="#F2EFEC"/>
  <circle cx="220" cy="201" r="3.0" fill="#EDE9E4"/>
  <circle cx="233" cy="206" r="2.8" fill="#EFECEA"/>
  <!-- Rice highlight -->
  <ellipse cx="178" cy="186" rx="44" ry="18" fill="#FFFFFF" opacity="0.48"/>

  <!-- Mushroom sauce pool -->
  <ellipse cx="296" cy="178" rx="62" ry="38" fill="url(#sauceGrad)" opacity="0.88"/>
  <circle cx="272" cy="165" r="8" fill="#A16207" opacity="0.72"/>
  <circle cx="318" cy="168" r="7" fill="#92400E" opacity="0.68"/>
  <circle cx="308" cy="155" r="6" fill="#78350F" opacity="0.65"/>
  <!-- Mushroom pieces -->
  <ellipse cx="282" cy="172" rx="11" ry="7" fill="#D97706" opacity="0.80"/>
  <ellipse cx="305" cy="180" rx="10" ry="6" fill="#B45309" opacity="0.76"/>
  <ellipse cx="316" cy="165" rx="9" ry="6" fill="#D97706" opacity="0.72"/>
  <!-- Sauce highlight -->
  <ellipse cx="288" cy="168" rx="22" ry="11" fill="#FDE68A" opacity="0.28"/>

  <!-- Sirloin steak body -->
  <path d="M235 145 Q280 130 330 148 Q350 162 338 192 Q326 210 285 208 Q248 206 230 192 Q215 178 218 162 Q220 148 235 145Z" fill="url(#steakGrad)"/>
  <!-- Fat marbling lines -->
  <path d="M245 155 Q265 150 285 158 Q290 162 282 168" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M258 170 Q275 165 292 172 Q298 176 290 182" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" opacity="0.40"/>
  <!-- Steak grill marks -->
  <line x1="252" y1="148" x2="238" y2="195" stroke="#3B1600" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
  <line x1="272" y1="144" x2="258" y2="191" stroke="#3B1600" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
  <line x1="292" y1="142" x2="278" y2="189" stroke="#3B1600" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
  <!-- Steak seared edge highlight -->
  <path d="M235 145 Q280 130 330 148 Q340 155 332 165" fill="none" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.30"/>
  <!-- Top sheen -->
  <ellipse cx="272" cy="160" rx="32" ry="14" fill="#FDE68A" opacity="0.18"/>

  <!-- Green side garnish -->
  <ellipse cx="174" cy="172" rx="22" ry="10" fill="#16A34A" opacity="0.78"/>
  <ellipse cx="174" cy="170" rx="20" ry="8" fill="#22C55E" opacity="0.70"/>
  <circle cx="163" cy="168" r="4" fill="#16A34A" opacity="0.72"/>
  <circle cx="185" cy="167" r="3.5" fill="#4ADE80" opacity="0.65"/>
  <circle cx="174" cy="163" r="3" fill="#86EFAC" opacity="0.60"/>

  <!-- Steam curls -->
  <path d="M258 128 Q253 114 259 100 Q265 86 260 72" fill="none" stroke="#D1D5DB" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
  <path d="M280 124 Q275 109 281 94 Q287 79 282 64" fill="none" stroke="#D1D5DB" stroke-width="2.8" stroke-linecap="round" opacity="0.50"/>
  <path d="M302 127 Q297 112 303 97 Q309 82 304 67" fill="none" stroke="#D1D5DB" stroke-width="2.8" stroke-linecap="round" opacity="0.48"/>

  <!-- Depth overlay -->
  <rect width="480" height="280" fill="url(#depthOverlay)"/>
  <!-- Grain texture -->
  <rect width="480" height="280" fill="url(#bgGrad)" filter="url(#grain)" opacity="0.4"/>
</svg>
