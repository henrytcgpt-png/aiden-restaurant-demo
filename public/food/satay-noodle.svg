<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF1F2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FCE7F3;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="bowlGrad" cx="48%" cy="42%" r="56%">
      <stop offset="0%" style="stop-color:#3D2B1F;stop-opacity:1"/>
      <stop offset="65%" style="stop-color:#2D1B10;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1C0F0A;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="brothGrad" cx="44%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FBBF8A;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#F97316;stop-opacity:0.75"/>
      <stop offset="100%" style="stop-color:#C2410C;stop-opacity:0.65"/>
    </radialGradient>
    <radialGradient id="satayGrad" cx="40%" cy="35%" r="62%">
      <stop offset="0%" style="stop-color:#D97706;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#B45309;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#78350F;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="beefGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#7C2D12;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#431407;stop-opacity:1"/>
    </radialGradient>
    <linearGradient id="depthOverlay" x1="0%" y1="55%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#831843;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" result="blend"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="blobBlur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="bowlShadow">
      <feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#9D174D" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="280" fill="url(#bgGrad)"/>

  <!-- Decorative blobs -->
  <circle cx="55" cy="50" r="80" fill="#F472B6" opacity="0.18" filter="url(#blobBlur)"/>
  <circle cx="428" cy="228" r="88" fill="#EC4899" opacity="0.2" filter="url(#blobBlur)"/>
  <circle cx="400" cy="36" r="65" fill="#FBCFE8" opacity="0.28" filter="url(#blobBlur)"/>
  <circle cx="76" cy="246" r="52" fill="#F9A8D4" opacity="0.24" filter="url(#blobBlur)"/>

  <!-- Accent circles -->
  <circle cx="444" cy="57" r="18" fill="#F472B6" opacity="0.14"/>
  <circle cx="462" cy="78" r="10" fill="#EC4899" opacity="0.18"/>
  <circle cx="40" cy="214" r="14" fill="#DB2777" opacity="0.17"/>
  <circle cx="19" cy="240" r="9" fill="#FBCFE8" opacity="0.24"/>
  <circle cx="460" cy="176" r="11" fill="#F9A8D4" opacity="0.28"/>

  <!-- Bowl drop shadow -->
  <ellipse cx="240" cy="254" rx="135" ry="16" fill="#9D174D" opacity="0.14"/>

  <!-- Bowl outer -->
  <ellipse cx="240" cy="188" rx="150" ry="92" fill="url(#bowlGrad)" filter="url(#bowlShadow)"/>
  <!-- Bowl inner rim -->
  <path d="M96 164 Q168 136 240 140 Q312 136 384 164" fill="none" stroke="#5A3E34" stroke-width="2.5" opacity="0.35"/>

  <!-- Broth surface -->
  <ellipse cx="240" cy="180" rx="132" ry="78" fill="url(#brothGrad)" opacity="0.88"/>
  <!-- Broth shimmer -->
  <ellipse cx="210" cy="168" rx="62" ry="22" fill="#FDE68A" opacity="0.2"/>

  <!-- Satay sauce pool in center -->
  <ellipse cx="240" cy="188" rx="88" ry="48" fill="url(#satayGrad)" opacity="0.82"/>
  <ellipse cx="228" cy="182" rx="55" ry="25" fill="#D97706" opacity="0.35"/>

  <!-- Noodle nest — wavy/spiral lines in cream -->
  <!-- Outer ring of noodles -->
  <path d="M168 182 Q180 170 195 178 Q210 186 218 174 Q226 162 238 170 Q250 178 262 166 Q274 154 284 164 Q294 174 302 165 Q308 178 298 188 Q286 198 272 190 Q258 202 244 194 Q230 206 216 198 Q202 210 188 200 Q174 192 168 182Z" fill="none" stroke="#F5EACF" stroke-width="3.5" stroke-linecap="round" opacity="0.88"/>
  <!-- Inner noodle spiral -->
  <path d="M190 184 Q202 175 214 182 Q226 189 234 180 Q242 171 252 178 Q262 185 270 177 Q278 186 268 194 Q256 202 244 196 Q232 204 220 197 Q208 204 198 196 Q188 190 190 184Z" fill="none" stroke="#EFE0C4" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <!-- Center noodle -->
  <path d="M212 185 Q220 179 230 184 Q240 189 248 183 Q256 190 248 196 Q238 202 228 198 Q218 204 212 196 Q208 190 212 185Z" fill="none" stroke="#E8D5B4" stroke-width="2.5" stroke-linecap="round" opacity="0.82"/>

  <!-- Beef slice ovals — overlapping -->
  <ellipse cx="172" cy="172" rx="26" ry="14" fill="url(#beefGrad)" transform="rotate(-18,172,172)"/>
  <ellipse cx="182" cy="165" rx="26" ry="13" fill="url(#beefGrad)" transform="rotate(-22,182,165)"/>
  <ellipse cx="172" cy="172" rx="18" ry="8" fill="#A33010" opacity="0.4" transform="rotate(-18,172,172)"/>

  <ellipse cx="302" cy="170" rx="25" ry="13" fill="url(#beefGrad)" transform="rotate(15,302,170)"/>
  <ellipse cx="312" cy="163" rx="25" ry="13" fill="url(#beefGrad)" transform="rotate(18,312,163)"/>
  <ellipse cx="302" cy="170" rx="17" ry="7" fill="#A33010" opacity="0.38" transform="rotate(15,302,170)"/>

  <!-- Green onion strips — thin rectangles -->
  <rect x="215" y="155" width="4" height="32" rx="2" fill="#4ADE80" opacity="0.82" transform="rotate(-12,217,171)"/>
  <rect x="228" y="152" width="3.5" height="30" rx="1.8" fill="#22C55E" opacity="0.78" transform="rotate(5,230,167)"/>
  <rect x="242" y="155" width="4" height="28" rx="2" fill="#4ADE80" opacity="0.75" transform="rotate(-8,244,169)"/>
  <rect x="256" y="157" width="3.5" height="26" rx="1.8" fill="#16A34A" opacity="0.8" transform="rotate(10,258,170)"/>

  <!-- Sesame/chili dots -->
  <circle cx="196" cy="188" r="2.2" fill="#F87171" opacity="0.7"/>
  <circle cx="284" cy="192" r="2.0" fill="#EF4444" opacity="0.65"/>
  <circle cx="240" cy="163" r="1.8" fill="#FCA5A5" opacity="0.6"/>
  <circle cx="220" cy="205" r="1.8" fill="#F87171" opacity="0.58"/>
  <circle cx="260" cy="200" r="1.8" fill="#EF4444" opacity="0.6"/>

  <!-- Depth overlay -->
  <rect width="480" height="280" fill="url(#depthOverlay)"/>
  <rect width="480" height="280" fill="url(#bgGrad)" filter="url(#grain)" opacity="0.4"/>
</svg>
