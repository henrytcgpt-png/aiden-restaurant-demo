<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="bowlGrad" cx="46%" cy="38%" r="58%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#F0F5FA;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#CBD5E1;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="brothGrad" cx="44%" cy="40%" r="62%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#BFDBFE;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:0.7"/>
    </radialGradient>
    <radialGradient id="wontGrad" cx="36%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#FFFDE7;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#FDE68A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:0.8"/>
    </radialGradient>
    <radialGradient id="shrimpGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#FCA5A5;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#F87171;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0.85"/>
    </radialGradient>
    <linearGradient id="depthOverlay" x1="0%" y1="55%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:0.18"/>
    </linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" result="blend"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="blobBlur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="bowlShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3B82F6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="280" fill="url(#bgGrad)"/>

  <!-- Decorative blobs -->
  <circle cx="54" cy="50" r="80" fill="#3B82F6" opacity="0.16" filter="url(#blobBlur)"/>
  <circle cx="428" cy="228" r="88" fill="#60A5FA" opacity="0.2" filter="url(#blobBlur)"/>
  <circle cx="400" cy="36" r="65" fill="#BFDBFE" opacity="0.3" filter="url(#blobBlur)"/>
  <circle cx="76" cy="246" r="52" fill="#93C5FD" opacity="0.24" filter="url(#blobBlur)"/>

  <!-- Accent circles -->
  <circle cx="444" cy="57" r="18" fill="#3B82F6" opacity="0.14"/>
  <circle cx="462" cy="78" r="10" fill="#60A5FA" opacity="0.18"/>
  <circle cx="40" cy="214" r="14" fill="#2563EB" opacity="0.16"/>
  <circle cx="20" cy="240" r="9" fill="#BFDBFE" opacity="0.24"/>
  <circle cx="460" cy="176" r="11" fill="#93C5FD" opacity="0.28"/>

  <!-- Bowl shadow -->
  <ellipse cx="240" cy="255" rx="138" ry="16" fill="#1E40AF" opacity="0.12"/>

  <!-- Bowl outer (white ceramic) -->
  <ellipse cx="240" cy="186" rx="152" ry="96" fill="#CBD5E1" filter="url(#bowlShadow)"/>
  <ellipse cx="240" cy="183" rx="145" ry="90" fill="url(#bowlGrad)"/>
  <!-- Ceramic bowl rim detail -->
  <ellipse cx="240" cy="183" rx="134" ry="80" fill="none" stroke="#E2E8F0" stroke-width="3"/>
  <path d="M106 164 Q175 136 240 140 Q305 136 374 164" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>

  <!-- Broth surface (clear, light blue tint) -->
  <ellipse cx="240" cy="185" rx="126" ry="74" fill="url(#brothGrad)"/>
  <!-- Broth shimmer highlights -->
  <ellipse cx="210" cy="172" rx="58" ry="20" fill="#FFFFFF" opacity="0.22"/>
  <ellipse cx="285" cy="178" rx="35" ry="13" fill="#DBEAFE" opacity="0.35"/>

  <!-- Noodle swirls — wavy cream lines -->
  <path d="M165 188 Q178 178 192 186 Q206 194 218 183 Q230 172 242 180 Q254 188 266 177 Q278 166 290 175 Q302 184 310 174" fill="none" stroke="#F5EACF" stroke-width="4" stroke-linecap="round" opacity="0.82"/>
  <path d="M172 198 Q185 188 198 196 Q211 204 224 193 Q237 182 250 191 Q263 200 276 189 Q289 178 300 188" fill="none" stroke="#EFE0C4" stroke-width="3.5" stroke-linecap="round" opacity="0.78"/>
  <path d="M176 207 Q188 198 200 206 Q212 214 225 204 Q238 194 250 202 Q262 210 274 201" fill="none" stroke="#E8D5B4" stroke-width="3" stroke-linecap="round" opacity="0.72"/>

  <!-- Wonton dumplings — 3 folded shapes in pale yellow -->
  <!-- Wonton 1 (left) -->
  <ellipse cx="185" cy="185" rx="26" ry="18" fill="url(#wontGrad)"/>
  <path d="M163 182 Q185 168 207 182 Q185 196 163 182Z" fill="#FEF9C3" opacity="0.55"/>
  <path d="M163 182 Q174 177 185 182 Q196 187 207 182" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.5"/>
  <!-- Wonton fold detail -->
  <path d="M168 184 Q185 176 202 184" fill="none" stroke="#F59E0B" stroke-width="1.2" opacity="0.45"/>

  <!-- Wonton 2 (center) -->
  <ellipse cx="240" cy="175" rx="28" ry="19" fill="url(#wontGrad)"/>
  <path d="M216 172 Q240 158 264 172 Q240 186 216 172Z" fill="#FEF9C3" opacity="0.55"/>
  <path d="M216 172 Q228 167 240 172 Q252 177 264 172" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.5"/>
  <path d="M222 174 Q240 166 258 174" fill="none" stroke="#F59E0B" stroke-width="1.2" opacity="0.45"/>

  <!-- Wonton 3 (right) -->
  <ellipse cx="298" cy="182" rx="27" ry="18" fill="url(#wontGrad)"/>
  <path d="M275 179 Q298 165 321 179 Q298 193 275 179Z" fill="#FEF9C3" opacity="0.55"/>
  <path d="M275 179 Q286 174 298 179 Q310 184 321 179" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.5"/>
  <path d="M280 181 Q298 173 316 181" fill="none" stroke="#F59E0B" stroke-width="1.2" opacity="0.45"/>

  <!-- Shrimp — curved comma shapes -->
  <path d="M162 205 Q155 195 160 185 Q165 175 175 178 Q185 181 185 190 Q185 200 176 205 Q168 210 162 205Z" fill="url(#shrimpGrad)"/>
  <path d="M163 205 Q158 196 162 188 Q166 180 174 183 Q180 186 179 194 Q178 202 172 206 Q167 209 163 205Z" fill="#FCA5A5" opacity="0.5"/>
  <!-- Shrimp tail -->
  <path d="M162 205 Q158 210 162 214 Q166 212 163 208" fill="#F87171" opacity="0.7"/>

  <path d="M310 198 Q318 188 316 178 Q314 168 304 168 Q294 168 292 178 Q290 188 297 196 Q304 204 310 198Z" fill="url(#shrimpGrad)"/>
  <path d="M309 197 Q315 189 313 181 Q311 173 304 173 Q297 173 295 181 Q293 189 299 196 Q305 202 309 197Z" fill="#FCA5A5" opacity="0.5"/>
  <path d="M310 198 Q314 204 310 207 Q306 205 308 200" fill="#F87171" opacity="0.7"/>

  <!-- Green onion garnish -->
  <rect x="228" y="155" width="3.5" height="28" rx="1.8" fill="#4ADE80" opacity="0.8" transform="rotate(-8,230,169)"/>
  <rect x="242" y="157" width="3" height="25" rx="1.5" fill="#22C55E" opacity="0.75" transform="rotate(6,244,170)"/>

  <!-- Sesame dots on wontons -->
  <circle cx="185" cy="182" r="1.8" fill="#D97706" opacity="0.6"/>
  <circle cx="240" cy="172" r="1.8" fill="#D97706" opacity="0.6"/>
  <circle cx="298" cy="180" r="1.8" fill="#D97706" opacity="0.6"/>

  <!-- Steam curls -->
  <path d="M210 138 Q205 124 211 110 Q217 96 212 82" fill="none" stroke="#CBD5E1" stroke-width="2.6" stroke-linecap="round" opacity="0.52"/>
  <path d="M240 134 Q235 119 241 104 Q247 89 242 74" fill="none" stroke="#CBD5E1" stroke-width="2.6" stroke-linecap="round" opacity="0.48"/>
  <path d="M268 136 Q263 122 269 107 Q275 92 270 78" fill="none" stroke="#CBD5E1" stroke-width="2.6" stroke-linecap="round" opacity="0.48"/>

  <!-- Depth overlay -->
  <rect width="480" height="280" fill="url(#depthOverlay)"/>
  <rect width="480" height="280" fill="url(#bgGrad)" filter="url(#grain)" opacity="0.4"/>
</svg>
