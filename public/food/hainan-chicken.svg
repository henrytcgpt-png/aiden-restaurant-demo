<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ECFDF5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D1FAE5;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="plateGrad" cx="44%" cy="37%" r="58%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="72%" style="stop-color:#F6FAF8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E2EDE9;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="riceGrad" cx="40%" cy="32%" r="62%">
      <stop offset="0%" style="stop-color:#FFFEF8;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#FEF9E7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FEF3C7;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="chickenGrad" cx="34%" cy="28%" r="65%">
      <stop offset="0%" style="stop-color:#FEF9C3;stop-opacity:1"/>
      <stop offset="45%" style="stop-color:#FDE68A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1"/>
    </radialGradient>
    <linearGradient id="sauceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6EE7B7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="depthOverlay" x1="0%" y1="58%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#065F46;stop-opacity:0.18"/>
    </linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" result="blend"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="blobBlur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="plateShadow">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="280" fill="url(#bgGrad)"/>

  <!-- Decorative blobs -->
  <circle cx="52" cy="50" r="80" fill="#10B981" opacity="0.17" filter="url(#blobBlur)"/>
  <circle cx="430" cy="225" r="90" fill="#34D399" opacity="0.2" filter="url(#blobBlur)"/>
  <circle cx="402" cy="34" r="65" fill="#A7F3D0" opacity="0.27" filter="url(#blobBlur)"/>
  <circle cx="72" cy="246" r="50" fill="#6EE7B7" opacity="0.23" filter="url(#blobBlur)"/>

  <!-- Accent circles -->
  <circle cx="442" cy="58" r="17" fill="#10B981" opacity="0.14"/>
  <circle cx="462" cy="80" r="10" fill="#34D399" opacity="0.18"/>
  <circle cx="40" cy="212" r="14" fill="#059669" opacity="0.17"/>
  <circle cx="20" cy="236" r="9" fill="#6EE7B7" opacity="0.22"/>
  <circle cx="458" cy="172" r="11" fill="#A7F3D0" opacity="0.28"/>

  <!-- Ground shadow -->
  <ellipse cx="240" cy="254" rx="140" ry="16" fill="#065F46" opacity="0.11"/>

  <!-- Plate outer -->
  <ellipse cx="240" cy="180" rx="152" ry="102" fill="#E2EDE9" filter="url(#plateShadow)"/>
  <!-- Plate surface -->
  <ellipse cx="240" cy="177" rx="144" ry="96" fill="url(#plateGrad)"/>
  <!-- Plate inner rim highlight -->
  <ellipse cx="240" cy="155" rx="130" ry="68" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.62"/>

  <!-- Green sauce pool -->
  <ellipse cx="240" cy="202" rx="92" ry="46" fill="url(#sauceGrad)" opacity="0.28"/>
  <path d="M160 198 Q192 187 230 202 Q268 217 308 198 Q328 188 322 200" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" opacity="0.38"/>

  <!-- Rice mound -->
  <ellipse cx="240" cy="198" rx="76" ry="44" fill="url(#riceGrad)"/>
  <!-- Rice texture dots -->
  <circle cx="212" cy="192" r="3.2" fill="#FEF9E7"/>
  <circle cx="226" cy="185" r="3.6" fill="#FFFEF8"/>
  <circle cx="240" cy="190" r="3.2" fill="#FEF9E7"/>
  <circle cx="254" cy="184" r="3.6" fill="#FFFEF8"/>
  <circle cx="268" cy="191" r="3.2" fill="#FEF9E7"/>
  <circle cx="207" cy="202" r="3.0" fill="#FFFEF8"/>
  <circle cx="221" cy="208" r="3.4" fill="#FEF9E7"/>
  <circle cx="235" cy="203" r="3.0" fill="#FFFEF8"/>
  <circle cx="249" cy="208" r="3.4" fill="#FEF9E7"/>
  <circle cx="263" cy="202" r="3.0" fill="#FFFEF8"/>
  <circle cx="276" cy="196" r="2.8" fill="#FEF3C7"/>
  <circle cx="197" cy="197" r="2.6" fill="#FDE68A" opacity="0.55"/>
  <circle cx="284" cy="193" r="2.6" fill="#FDE68A" opacity="0.55"/>
  <!-- Rice highlight -->
  <ellipse cx="228" cy="187" rx="40" ry="17" fill="#FFFFFF" opacity="0.52"/>

  <!-- Chicken piece 1 -->
  <rect x="168" y="177" width="70" height="34" rx="13" fill="url(#chickenGrad)" transform="rotate(-9,203,194)"/>
  <ellipse cx="198" cy="189" rx="24" ry="10" fill="#FEF9C3" opacity="0.42" transform="rotate(-9,198,189)"/>

  <!-- Chicken piece 2 -->
  <rect x="208" y="162" width="74" height="32" rx="12" fill="#FDE68A"/>
  <rect x="208" y="162" width="74" height="32" rx="12" fill="url(#chickenGrad)" opacity="0.82" transform="rotate(4,245,178)"/>
  <ellipse cx="244" cy="173" rx="26" ry="10" fill="#FEF9C3" opacity="0.45" transform="rotate(4,244,173)"/>

  <!-- Chicken piece 3 -->
  <rect x="255" y="170" width="67" height="30" rx="11" fill="url(#chickenGrad)" transform="rotate(-6,288,185)"/>
  <ellipse cx="284" cy="178" rx="22" ry="9" fill="#FEF9C3" opacity="0.42" transform="rotate(-6,284,178)"/>

  <!-- Cucumber slices -->
  <ellipse cx="176" cy="213" rx="15" ry="10" fill="#86EFAC"/>
  <ellipse cx="176" cy="213" rx="9" ry="6" fill="#4ADE80" opacity="0.65"/>
  <line x1="176" y1="203" x2="176" y2="223" stroke="#166534" stroke-width="1.2" opacity="0.45"/>
  <line x1="167" y1="213" x2="185" y2="213" stroke="#166534" stroke-width="1.2" opacity="0.45"/>
  <line x1="170" y1="206" x2="182" y2="220" stroke="#166534" stroke-width="0.8" opacity="0.3"/>
  <line x1="170" y1="220" x2="182" y2="206" stroke="#166534" stroke-width="0.8" opacity="0.3"/>

  <ellipse cx="306" cy="217" rx="14" ry="9" fill="#86EFAC"/>
  <ellipse cx="306" cy="217" rx="8" ry="5.5" fill="#4ADE80" opacity="0.65"/>
  <line x1="306" y1="208" x2="306" y2="226" stroke="#166534" stroke-width="1.2" opacity="0.45"/>
  <line x1="298" y1="217" x2="314" y2="217" stroke="#166534" stroke-width="1.2" opacity="0.45"/>

  <!-- Herb dots scattered -->
  <circle cx="190" cy="176" r="3.0" fill="#22C55E" opacity="0.82"/>
  <circle cx="286" cy="197" r="2.6" fill="#22C55E" opacity="0.76"/>
  <circle cx="252" cy="222" r="2.6" fill="#16A34A" opacity="0.72"/>
  <circle cx="162" cy="192" r="2.2" fill="#22C55E" opacity="0.66"/>
  <circle cx="314" cy="182" r="2.2" fill="#4ADE80" opacity="0.72"/>
  <circle cx="218" cy="223" r="2.2" fill="#22C55E" opacity="0.66"/>
  <circle cx="272" cy="174" r="2.6" fill="#16A34A" opacity="0.72"/>
  <circle cx="230" cy="170" r="2.0" fill="#86EFAC" opacity="0.62"/>

  <!-- Sauce drizzle on top -->
  <path d="M183 183 Q200 172 222 179 Q242 185 256 173 Q272 162 285 171" fill="none" stroke="#059669" stroke-width="2.8" stroke-linecap="round" opacity="0.52"/>
  <path d="M190 195 Q210 188 228 195" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" opacity="0.38"/>

  <!-- Depth overlay -->
  <rect width="480" height="280" fill="url(#depthOverlay)"/>
  <rect width="480" height="280" fill="url(#bgGrad)" filter="url(#grain)" opacity="0.4"/>
</svg>
