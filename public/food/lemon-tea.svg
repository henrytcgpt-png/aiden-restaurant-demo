<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEFCE8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FEF9C3;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.85"/>
      <stop offset="15%" style="stop-color:#FEF9C3;stop-opacity:0.55"/>
      <stop offset="50%" style="stop-color:#FEF08A;stop-opacity:0.35"/>
      <stop offset="82%" style="stop-color:#FDE047;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.72"/>
    </linearGradient>
    <linearGradient id="teaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE68A;stop-opacity:0.9"/>
      <stop offset="35%" style="stop-color:#F59E0B;stop-opacity:0.88"/>
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:0.95"/>
    </linearGradient>
    <linearGradient id="iceAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF9C3;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:0.75"/>
    </linearGradient>
    <radialGradient id="lemonGrad" cx="45%" cy="40%" r="58%">
      <stop offset="0%" style="stop-color:#FEFCE8;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#FEF08A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#EAB308;stop-opacity:1"/>
    </radialGradient>
    <linearGradient id="depthOverlay" x1="0%" y1="55%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#713F12;stop-opacity:0.18"/>
    </linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" result="blend"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="blobBlur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glassShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#EAB308" flood-opacity="0.3"/>
    </filter>
    <clipPath id="glassClip">
      <rect x="178" y="45" width="84" height="205" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="480" height="280" fill="url(#bgGrad)"/>

  <!-- Decorative blobs -->
  <circle cx="55" cy="50" r="82" fill="#EAB308" opacity="0.17" filter="url(#blobBlur)"/>
  <circle cx="428" cy="228" r="88" fill="#FBBF24" opacity="0.2" filter="url(#blobBlur)"/>
  <circle cx="400" cy="36" r="65" fill="#FEF08A" opacity="0.3" filter="url(#blobBlur)"/>
  <circle cx="76" cy="246" r="52" fill="#FDE047" opacity="0.22" filter="url(#blobBlur)"/>

  <!-- Accent circles -->
  <circle cx="444" cy="57" r="18" fill="#EAB308" opacity="0.14"/>
  <circle cx="462" cy="79" r="10" fill="#FBBF24" opacity="0.2"/>
  <circle cx="40" cy="214" r="14" fill="#CA8A04" opacity="0.17"/>
  <circle cx="20" cy="240" r="9" fill="#FEF08A" opacity="0.25"/>
  <circle cx="462" cy="178" r="11" fill="#FDE047" opacity="0.28"/>
  <!-- Small decorative circles -->
  <circle cx="152" cy="88" r="8" fill="#FEF08A" opacity="0.32"/>
  <circle cx="340" cy="95" r="10" fill="#EAB308" opacity="0.2"/>
  <circle cx="148" cy="215" r="6" fill="#FBBF24" opacity="0.28"/>
  <circle cx="340" cy="220" r="7" fill="#FDE047" opacity="0.25"/>

  <!-- Glass drop shadow -->
  <ellipse cx="220" cy="258" rx="52" ry="10" fill="#CA8A04" opacity="0.2"/>

  <!-- Glass outer shape (tall rounded rectangle) -->
  <rect x="177" y="44" width="86" height="207" rx="15" fill="#FFFDE7" filter="url(#glassShadow)" opacity="0.3"/>

  <!-- Tea liquid fill (lower 75%) -->
  <rect x="178" y="95" width="84" height="156" rx="0" fill="url(#teaFill)" clip-path="url(#glassClip)"/>

  <!-- Ice/top lighter section -->
  <rect x="178" y="45" width="84" height="55" fill="url(#iceAreaGrad)" clip-path="url(#glassClip)"/>

  <!-- Glass body overlay (transparent effect) -->
  <rect x="178" y="45" width="84" height="205" rx="14" fill="url(#glassBody)"/>
  <rect x="178" y="45" width="84" height="205" rx="14" fill="none" stroke="#FDE047" stroke-width="2" opacity="0.55"/>

  <!-- Glass highlight strip left -->
  <rect x="182" y="52" width="10" height="192" rx="5" fill="#FFFFFF" opacity="0.45"/>
  <!-- Glass highlight strip right -->
  <rect x="246" y="60" width="7" height="170" rx="3.5" fill="#FFFFFF" opacity="0.22"/>

  <!-- Condensation dots on glass exterior -->
  <circle cx="175" cy="120" r="2.8" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="172" cy="134" r="2.0" fill="#DBEAFE" opacity="0.7"/>
  <circle cx="265" cy="128" r="2.4" fill="#FFFFFF" opacity="0.62"/>
  <circle cx="268" cy="145" r="1.8" fill="#BFDBFE" opacity="0.65"/>
  <circle cx="174" cy="155" r="2.2" fill="#FFFFFF" opacity="0.58"/>
  <circle cx="266" cy="168" r="2.0" fill="#BFDBFE" opacity="0.6"/>
  <circle cx="172" cy="180" r="1.6" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="264" cy="190" r="2.2" fill="#DBEAFE" opacity="0.58"/>
  <!-- Condensation drip -->
  <path d="M175 134 Q173 144 174 155" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  <path d="M266 145 Q267 158 266 168" fill="none" stroke="#BFDBFE" stroke-width="1.5" opacity="0.38"/>

  <!-- Ice cubes inside glass -->
  <!-- Ice cube 1 -->
  <rect x="186" y="62" width="24" height="18" rx="4" fill="#FFFFFF" opacity="0.72"/>
  <rect x="187" y="63" width="22" height="16" rx="3" fill="#EFF6FF" opacity="0.55"/>
  <line x1="186" y1="70" x2="210" y2="70" stroke="#BFDBFE" stroke-width="0.8" opacity="0.5"/>
  <line x1="198" y1="62" x2="198" y2="80" stroke="#BFDBFE" stroke-width="0.8" opacity="0.5"/>

  <!-- Ice cube 2 -->
  <rect x="218" y="58" width="22" height="20" rx="4" fill="#FFFFFF" opacity="0.68"/>
  <rect x="219" y="59" width="20" height="18" rx="3" fill="#EFF6FF" opacity="0.52"/>
  <line x1="218" y1="68" x2="240" y2="68" stroke="#BFDBFE" stroke-width="0.8" opacity="0.45"/>
  <line x1="229" y1="58" x2="229" y2="78" stroke="#BFDBFE" stroke-width="0.8" opacity="0.45"/>

  <!-- Ice cube 3 (partially behind others) -->
  <rect x="204" y="70" width="20" height="16" rx="4" fill="#FFFFFF" opacity="0.6"/>
  <rect x="205" y="71" width="18" height="14" rx="3" fill="#DBEAFE" opacity="0.42"/>

  <!-- Tea surface line -->
  <line x1="179" y1="95" x2="261" y2="95" stroke="#FEF08A" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="220" cy="95" rx="40" ry="4" fill="#FEF9C3" opacity="0.35"/>

  <!-- Lemon slice on rim -->
  <circle cx="268" cy="88" r="30" fill="url(#lemonGrad)"/>
  <circle cx="268" cy="88" r="25" fill="none" stroke="#EAB308" stroke-width="1.5" opacity="0.6"/>
  <!-- Lemon segments -->
  <line x1="268" y1="58" x2="268" y2="118" stroke="#EAB308" stroke-width="1.2" opacity="0.55"/>
  <line x1="238" y1="88" x2="298" y2="88" stroke="#EAB308" stroke-width="1.2" opacity="0.55"/>
  <line x1="247" y1="63" x2="289" y2="113" stroke="#EAB308" stroke-width="1.0" opacity="0.45"/>
  <line x1="247" y1="113" x2="289" y2="63" stroke="#EAB308" stroke-width="1.0" opacity="0.45"/>
  <!-- Lemon center -->
  <circle cx="268" cy="88" r="8" fill="#FEF9C3" opacity="0.7"/>
  <!-- Lemon peel edge -->
  <circle cx="268" cy="88" r="30" fill="none" stroke="#CA8A04" stroke-width="2.5"/>
  <!-- Lemon notch on glass rim -->
  <line x1="252" y1="74" x2="248" y2="78" stroke="#CA8A04" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Straw (tall rectangle) -->
  <rect x="232" y="30" width="8" height="185" rx="4" fill="#F87171" opacity="0.88"/>
  <rect x="233" y="30" width="3" height="185" rx="1.5" fill="#FFFFFF" opacity="0.32"/>

  <!-- Depth overlay -->
  <rect width="480" height="280" fill="url(#depthOverlay)"/>
  <rect width="480" height="280" fill="url(#bgGrad)" filter="url(#grain)" opacity="0.4"/>
</svg>
