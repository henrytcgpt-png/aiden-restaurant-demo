<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFBEB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FEF3C7;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="bowlGrad" cx="48%" cy="42%" r="56%">
      <stop offset="0%" style="stop-color:#44403C;stop-opacity:1"/>
      <stop offset="65%" style="stop-color:#292524;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1C1917;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="curryGrad" cx="44%" cy="38%" r="62%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1"/>
      <stop offset="52%" style="stop-color:#F59E0B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="riceGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F5F0E8;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="beefGrad" cx="32%" cy="28%" r="68%">
      <stop offset="0%" style="stop-color:#92400E;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#78350F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#451A03;stop-opacity:1"/>
    </radialGradient>
    <linearGradient id="depthOverlay" x1="0%" y1="55%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.22"/>
    </linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" result="blend"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="blobBlur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="bowlShadow">
      <feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#92400E" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="280" fill="url(#bgGrad)"/>

  <!-- Decorative blobs -->
  <circle cx="58" cy="48" r="82" fill="#F59E0B" opacity="0.18" filter="url(#blobBlur)"/>
  <circle cx="428" cy="232" r="88" fill="#FBBF24" opacity="0.21" filter="url(#blobBlur)"/>
  <circle cx="398" cy="36" r="64" fill="#FDE68A" opacity="0.28" filter="url(#blobBlur)"/>
  <circle cx="78" cy="248" r="52" fill="#FCD34D" opacity="0.23" filter="url(#blobBlur)"/>

  <!-- Accent circles -->
  <circle cx="444" cy="56" r="18" fill="#F59E0B" opacity="0.14"/>
  <circle cx="462" cy="78" r="10" fill="#FBBF24" opacity="0.2"/>
  <circle cx="42" cy="216" r="14" fill="#D97706" opacity="0.17"/>
  <circle cx="20" cy="242" r="9" fill="#FDE68A" opacity="0.22"/>
  <circle cx="458" cy="178" r="11" fill="#FCD34D" opacity="0.28"/>
  <!-- Sparkle dots top right -->
  <circle cx="402" cy="96" r="4.2" fill="#FDE68A" opacity="0.52"/>
  <circle cx="414" cy="88" r="2.8" fill="#F59E0B" opacity="0.42"/>
  <circle cx="407" cy="108" r="2.2" fill="#FCD34D" opacity="0.46"/>

  <!-- Bowl drop shadow -->
  <ellipse cx="240" cy="254" rx="132" ry="16" fill="#92400E" opacity="0.14"/>

  <!-- Bowl outer body -->
  <ellipse cx="240" cy="188" rx="148" ry="92" fill="url(#bowlGrad)" filter="url(#bowlShadow)"/>
  <!-- Bowl inner rim highlight -->
  <path d="M98 162 Q170 133 240 138 Q310 133 382 162" fill="none" stroke="#6B5A4E" stroke-width="2.5" opacity="0.35"/>

  <!-- Curry liquid fill -->
  <ellipse cx="240" cy="180" rx="130" ry="78" fill="url(#curryGrad)"/>
  <!-- Wavy curry surface -->
  <path d="M110 158 Q128 147 148 154 Q168 161 188 150 Q208 139 228 148 Q248 157 268 147 Q288 137 308 146 Q328 155 348 145 Q368 135 370 158" fill="url(#curryGrad)" stroke="none"/>
  <!-- Curry shimmer -->
  <ellipse cx="205" cy="168" rx="64" ry="24" fill="#FCD34D" opacity="0.32"/>
  <ellipse cx="295" cy="174" rx="40" ry="15" fill="#FDE68A" opacity="0.22"/>

  <!-- Rice island -->
  <ellipse cx="240" cy="183" rx="50" ry="32" fill="url(#riceGrad)"/>
  <ellipse cx="240" cy="178" rx="48" ry="28" fill="#FEFEFE"/>
  <!-- Rice texture -->
  <circle cx="222" cy="177" r="3.2" fill="#F0EDE8"/>
  <circle cx="234" cy="170" r="3.6" fill="#FFFBF5"/>
  <circle cx="248" cy="175" r="3.2" fill="#F0EDE8"/>
  <circle cx="258" cy="168" r="3.0" fill="#FFFBF5"/>
  <circle cx="225" cy="187" r="3.0" fill="#F0EDE8"/>
  <circle cx="240" cy="192" r="3.4" fill="#FFFBF5"/>
  <circle cx="254" cy="186" r="3.0" fill="#F0EDE8"/>
  <circle cx="213" cy="183" r="2.6" fill="#F5F0E8" opacity="0.7"/>
  <circle cx="266" cy="181" r="2.6" fill="#F5F0E8" opacity="0.7"/>
  <!-- Rice highlight -->
  <ellipse cx="232" cy="173" rx="24" ry="11" fill="#FFFFFF" opacity="0.62"/>

  <!-- Beef chunks — rounded rectangles -->
  <rect x="148" y="170" width="44" height="30" rx="9" fill="url(#beefGrad)"/>
  <ellipse cx="170" cy="178" rx="15" ry="7" fill="#A16207" opacity="0.38"/>
  <ellipse cx="164" cy="174" rx="10" ry="5" fill="#C77F1A" opacity="0.22"/>

  <rect x="294" y="164" width="46" height="28" rx="9" fill="url(#beefGrad)"/>
  <ellipse cx="317" cy="172" rx="16" ry="7" fill="#A16207" opacity="0.35"/>

  <rect x="172" y="200" width="40" height="26" rx="8" fill="url(#beefGrad)"/>
  <ellipse cx="192" cy="208" rx="13" ry="6" fill="#92400E" opacity="0.38"/>

  <rect x="278" y="198" width="42" height="27" rx="8" fill="url(#beefGrad)"/>
  <ellipse cx="299" cy="206" rx="14" ry="6" fill="#A16207" opacity="0.32"/>

  <!-- Potato/onion pieces in curry -->
  <ellipse cx="163" cy="203" rx="19" ry="13" fill="#FCD34D" opacity="0.88"/>
  <ellipse cx="163" cy="200" rx="16" ry="10" fill="#FDE68A" opacity="0.75"/>
  <ellipse cx="320" cy="200" rx="17" ry="12" fill="#FCD34D" opacity="0.82"/>
  <ellipse cx="320" cy="197" rx="14" ry="9" fill="#FEF3C7" opacity="0.7"/>

  <!-- Steam curls -->
  <path d="M208 138 Q203 123 209 108 Q215 93 210 78" fill="none" stroke="#D4D4D4" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
  <path d="M240 132 Q235 116 241 101 Q247 86 242 71" fill="none" stroke="#D4D4D4" stroke-width="2.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M270 136 Q265 121 271 106 Q277 91 272 76" fill="none" stroke="#D4D4D4" stroke-width="2.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Floating sparkle dots in curry -->
  <circle cx="292" cy="155" r="3.2" fill="#FDE68A" opacity="0.72"/>
  <circle cx="300" cy="148" r="2.0" fill="#FBBF24" opacity="0.62"/>
  <circle cx="183" cy="152" r="2.6" fill="#FEF3C7" opacity="0.68"/>
  <circle cx="176" cy="145" r="1.8" fill="#FCD34D" opacity="0.55"/>
  <circle cx="255" cy="150" r="2.2" fill="#FDE68A" opacity="0.58"/>

  <!-- Depth overlay -->
  <rect width="480" height="280" fill="url(#depthOverlay)"/>
  <rect width="480" height="280" fill="url(#bgGrad)" filter="url(#grain)" opacity="0.4"/>
</svg>
