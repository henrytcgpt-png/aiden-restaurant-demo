<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5F5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FEE2E2;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="plateGrad" cx="44%" cy="38%" r="58%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="72%" style="stop-color:#FFF8F8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FEE2E2;stop-opacity:0.85"/>
    </radialGradient>
    <radialGradient id="wing1Grad" cx="36%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1"/>
      <stop offset="45%" style="stop-color:#D97706;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#B45309;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#78350F;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="wing2Grad" cx="40%" cy="35%" r="62%">
      <stop offset="0%" style="stop-color:#FDE68A;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#D97706;stop-opacity:1"/>
      <stop offset="90%" style="stop-color:#92400E;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="wing3Grad" cx="38%" cy="28%" r="68%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#F59E0B;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#B45309;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7C2D12;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="sauceGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#FCA5A5;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#F87171;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:0.9"/>
    </radialGradient>
    <linearGradient id="depthOverlay" x1="0%" y1="55%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#7F1D1D;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" result="blend"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="blobBlur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="plateShadow">
      <feDropShadow dx="0" dy="7" stdDeviation="13" flood-color="#EF4444" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="280" fill="url(#bgGrad)"/>

  <!-- Decorative blobs -->
  <circle cx="56" cy="50" r="80" fill="#EF4444" opacity="0.17" filter="url(#blobBlur)"/>
  <circle cx="428" cy="228" r="88" fill="#F87171" opacity="0.2" filter="url(#blobBlur)"/>
  <circle cx="400" cy="36" r="65" fill="#FECACA" opacity="0.3" filter="url(#blobBlur)"/>
  <circle cx="76" cy="246" r="52" fill="#FCA5A5" opacity="0.24" filter="url(#blobBlur)"/>

  <!-- Accent circles -->
  <circle cx="444" cy="58" r="18" fill="#EF4444" opacity="0.14"/>
  <circle cx="462" cy="79" r="10" fill="#F87171" opacity="0.2"/>
  <circle cx="40" cy="214" r="14" fill="#DC2626" opacity="0.17"/>
  <circle cx="20" cy="240" r="9" fill="#FECACA" opacity="0.25"/>
  <circle cx="462" cy="178" r="11" fill="#FCA5A5" opacity="0.28"/>
  <!-- Extra accent -->
  <circle cx="155" cy="80" r="9" fill="#FCA5A5" opacity="0.28"/>
  <circle cx="148" cy="95" r="5" fill="#FECACA" opacity="0.32"/>
  <circle cx="342" cy="88" r="11" fill="#EF4444" opacity="0.16"/>
  <circle cx="354" cy="74" r="6" fill="#F87171" opacity="0.2"/>

  <!-- Ground shadow -->
  <ellipse cx="240" cy="254" rx="144" ry="17" fill="#B91C1C" opacity="0.13"/>

  <!-- Plate outer rim -->
  <ellipse cx="240" cy="178" rx="152" ry="102" fill="#F5DADA" filter="url(#plateShadow)"/>
  <!-- Plate surface -->
  <ellipse cx="240" cy="175" rx="145" ry="96" fill="url(#plateGrad)"/>
  <!-- Plate inner rim -->
  <ellipse cx="240" cy="175" rx="134" ry="87" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.65"/>

  <!-- Sauce puddle at bottom of plate -->
  <ellipse cx="240" cy="218" rx="80" ry="28" fill="url(#sauceGrad)" opacity="0.78"/>
  <ellipse cx="235" cy="213" rx="52" ry="16" fill="#FCA5A5" opacity="0.45"/>
  <!-- Sauce drips -->
  <circle cx="188" cy="215" r="8" fill="#F87171" opacity="0.7"/>
  <circle cx="296" cy="218" r="7" fill="#EF4444" opacity="0.65"/>
  <circle cx="170" cy="222" r="5" fill="#FCA5A5" opacity="0.6"/>

  <!-- Wing 1 (left, angled down-left) -->
  <ellipse cx="185" cy="185" rx="52" ry="30" fill="url(#wing1Grad)" transform="rotate(-28,185,185)"/>
  <!-- Wing 1 drumette end bump -->
  <circle cx="158" cy="205" r="18" fill="#D97706"/>
  <circle cx="158" cy="205" r="18" fill="url(#wing1Grad)" opacity="0.85"/>
  <!-- Wing 1 tip -->
  <ellipse cx="215" cy="163" rx="16" ry="10" fill="#B45309" transform="rotate(-28,215,163)"/>
  <!-- Wing 1 crispy edge -->
  <ellipse cx="185" cy="185" rx="52" ry="30" fill="none" stroke="#78350F" stroke-width="2" opacity="0.45" transform="rotate(-28,185,185)"/>
  <!-- Wing 1 highlight -->
  <ellipse cx="178" cy="177" rx="26" ry="13" fill="#FEF3C7" opacity="0.3" transform="rotate(-28,178,177)"/>

  <!-- Wing 2 (center, lying flat) -->
  <ellipse cx="240" cy="175" rx="60" ry="32" fill="url(#wing2Grad)" transform="rotate(5,240,175)"/>
  <!-- Wing 2 drumette -->
  <circle cx="200" cy="178" r="20" fill="#F59E0B"/>
  <circle cx="200" cy="178" r="20" fill="url(#wing2Grad)" opacity="0.88"/>
  <!-- Wing 2 flat part -->
  <ellipse cx="268" cy="173" rx="24" ry="14" fill="#92400E" opacity="0.75" transform="rotate(5,268,173)"/>
  <!-- Wing 2 crispy edge -->
  <ellipse cx="240" cy="175" rx="60" ry="32" fill="none" stroke="#7C2D12" stroke-width="2" opacity="0.42" transform="rotate(5,240,175)"/>
  <!-- Wing 2 highlight -->
  <ellipse cx="232" cy="167" rx="30" ry="13" fill="#FEF9C3" opacity="0.28" transform="rotate(5,232,167)"/>

  <!-- Wing 3 (right, angled up-right) -->
  <ellipse cx="296" cy="182" rx="52" ry="30" fill="url(#wing3Grad)" transform="rotate(25,296,182)"/>
  <!-- Wing 3 drumette -->
  <circle cx="322" cy="200" r="18" fill="#D97706"/>
  <circle cx="322" cy="200" r="18" fill="url(#wing3Grad)" opacity="0.85"/>
  <!-- Wing 3 tip -->
  <ellipse cx="268" cy="162" rx="15" ry="9" fill="#B45309" transform="rotate(25,268,162)"/>
  <!-- Wing 3 crispy edge -->
  <ellipse cx="296" cy="182" rx="52" ry="30" fill="none" stroke="#78350F" stroke-width="2" opacity="0.45" transform="rotate(25,296,182)"/>
  <!-- Wing 3 highlight -->
  <ellipse cx="290" cy="174" rx="25" ry="12" fill="#FEF3C7" opacity="0.28" transform="rotate(25,290,174)"/>

  <!-- Sesame dots scattered -->
  <circle cx="180" cy="190" r="2.2" fill="#FEF9C3" opacity="0.82"/>
  <circle cx="195" cy="178" r="2.0" fill="#FEF3C7" opacity="0.78"/>
  <circle cx="225" cy="167" r="2.2" fill="#FFFBEB" opacity="0.8"/>
  <circle cx="248" cy="172" r="2.0" fill="#FEF9C3" opacity="0.75"/>
  <circle cx="265" cy="182" r="2.2" fill="#FEF3C7" opacity="0.78"/>
  <circle cx="285" cy="170" r="2.0" fill="#FFFBEB" opacity="0.75"/>
  <circle cx="302" cy="187" r="2.2" fill="#FEF9C3" opacity="0.78"/>
  <circle cx="210" cy="196" r="1.8" fill="#FEF3C7" opacity="0.72"/>
  <circle cx="270" cy="195" r="1.8" fill="#FEF9C3" opacity="0.72"/>
  <circle cx="242" cy="188" r="2.0" fill="#FFFBEB" opacity="0.75"/>

  <!-- Red chili garnish -->
  <ellipse cx="235" cy="153" rx="14" ry="5" fill="#EF4444" opacity="0.88" transform="rotate(-15,235,153)"/>
  <ellipse cx="235" cy="153" rx="14" ry="5" fill="none" stroke="#B91C1C" stroke-width="1" opacity="0.5" transform="rotate(-15,235,153)"/>
  <ellipse cx="224" cy="157" rx="5" ry="3" fill="#DC2626" opacity="0.75" transform="rotate(-15,224,157)"/>
  <!-- Chili stem -->
  <line x1="249" y1="149" x2="253" y2="144" stroke="#22C55E" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Second chili -->
  <ellipse cx="255" cy="150" rx="12" ry="4.5" fill="#DC2626" opacity="0.82" transform="rotate(12,255,150)"/>
  <line x1="244" y1="146" x2="240" y2="141" stroke="#16A34A" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Depth overlay -->
  <rect width="480" height="280" fill="url(#depthOverlay)"/>
  <rect width="480" height="280" fill="url(#bgGrad)" filter="url(#grain)" opacity="0.4"/>
</svg>
